name: Verify source before release
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Source commit or branch to verify
        default: kun
        required: true
        type: string
  workflow_call:
    inputs:
      source_ref:
        required: true
        type: string
  push:
    branches: ['agent/**']
    paths: ['.github/workflows/verify-source.yml', '.github/workflows/desktop-mac.yml']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: jeff-kunkun/multica
          ref: ${{ inputs.source_ref || 'kun' }}
          persist-credentials: false
      - id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  frontend:
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
        with:
          repository: jeff-kunkun/multica
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm --filter @multica/mobile typecheck
      - run: pnpm --filter @multica/mobile lint
      - run: pnpm --filter @multica/mobile test
  backend:
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: multica
          POSTGRES_USER: multica
          POSTGRES_PASSWORD: multica
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U multica -d multica" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://multica:multica@localhost:5432/multica?sslmode=disable
      REDIS_TEST_URL: redis://localhost:6379/1
      GOFLAGS: -count=1
    steps:
      - uses: actions/checkout@v4
        with:
          repository: jeff-kunkun/multica
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: server/go.sum
      - run: make migration-lint
      - run: cd server && go run ./cmd/migrate up
      - run: bash scripts/test-go.sh --race --only regular
  agent-tests:
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GOFLAGS: -count=1
    steps:
      - uses: actions/checkout@v4
        with:
          repository: jeff-kunkun/multica
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: server/go.sum
      - run: bash scripts/test-go.sh --race --only agent
