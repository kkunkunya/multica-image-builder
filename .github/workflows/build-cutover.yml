name: Self-host images for a pinned commit (manual)

# Manual only: builds the production-named images for one commit before a
# signed cutover moves the box onto another branch. Only the sha tag is pushed
# (no :kun), so nothing follows these until autoupdate targets that commit.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full 40-character commit of jeff-kunkun/multica
        required: true

permissions:
  contents: read
  packages: write

concurrency:
  group: cutover-images-${{ inputs.sha }}
  cancel-in-progress: false

env:
  SOURCE: jeff-kunkun/multica

jobs:
  image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            dockerfile: Dockerfile
            build-args: |
              VERSION=${{ inputs.sha }}
              COMMIT=${{ inputs.sha }}
          - name: web
            dockerfile: Dockerfile.web
            build-args: |
              NEXT_PUBLIC_APP_VERSION=dev
    runs-on: ubuntu-latest
    steps:
      - name: Require a full commit sha
        run: |
          echo '${{ inputs.sha }}' | grep -Eq '^[0-9a-f]{40}$' || { echo "sha must be a full 40-character commit"; exit 1; }
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE }}
          ref: ${{ inputs.sha }}
      - id: date
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/multica-${{ matrix.name }}:sha-${{ inputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ inputs.sha }}
          cache-from: |
            type=gha,scope=test-${{ matrix.name }}
            type=gha,scope=selfhost-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=cutover-${{ matrix.name }}
          build-args: |
            ${{ matrix.build-args }}
            DATE=${{ steps.date.outputs.value }}
