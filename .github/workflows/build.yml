name: Self-host images (jeff-kunkun/multica@kun)

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# The box always targets the branch tip, so a superseded build is wasted work.
concurrency:
  group: selfhost-images
  cancel-in-progress: false

env:
  SOURCE: jeff-kunkun/multica
  BRANCH: kun

jobs:
  tip:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.tip.outputs.sha }}
      build: ${{ steps.check.outputs.build }}
    steps:
      - id: tip
        run: echo "sha=$(git ls-remote https://github.com/$SOURCE refs/heads/$BRANCH | cut -f1)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: check
        run: |
          sha='${{ steps.tip.outputs.sha }}'
          build=false
          for name in backend web; do
            docker manifest inspect "ghcr.io/${{ github.repository_owner }}/multica-$name:sha-$sha" >/dev/null 2>&1 || build=true
          done
          echo "tip $sha build=$build"
          echo "build=$build" >> "$GITHUB_OUTPUT"

  image:
    needs: tip
    if: needs.tip.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            dockerfile: Dockerfile
            build-args: |
              VERSION=${{ needs.tip.outputs.sha }}
              COMMIT=${{ needs.tip.outputs.sha }}
          - name: web
            dockerfile: Dockerfile.web
            build-args: |
              NEXT_PUBLIC_APP_VERSION=dev
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE }}
          ref: ${{ needs.tip.outputs.sha }}
      - id: date
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/multica-${{ matrix.name }}:sha-${{ needs.tip.outputs.sha }}
            ghcr.io/${{ github.repository_owner }}/multica-${{ matrix.name }}:kun
          # Links the package to this public repository so it is publicly pullable.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.tip.outputs.sha }}
          cache-from: type=gha,scope=selfhost-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=selfhost-${{ matrix.name }}
          build-args: |
            ${{ matrix.build-args }}
            DATE=${{ steps.date.outputs.value }}
