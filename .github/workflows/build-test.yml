name: Test images (jeff-kunkun/multica@<ref>, manual)

# Manual only: builds one branch or commit for a throwaway test instance.
# Separate package names, so neither self-host box ever picks these up.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or commit of jeff-kunkun/multica to build
        required: true
      version:
        description: Version label baked into the backend (defaults to the commit)
        required: false

permissions:
  contents: read
  packages: write

concurrency:
  group: test-images-${{ inputs.ref }}
  cancel-in-progress: true

env:
  SOURCE: jeff-kunkun/multica
  IMAGE_PREFIX: multica-test

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE }}
          ref: ${{ inputs.ref }}
      - id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  image:
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            dockerfile: Dockerfile
          - name: web
            dockerfile: Dockerfile.web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE }}
          ref: ${{ needs.resolve.outputs.sha }}
      - id: date
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_PREFIX }}-${{ matrix.name }}:sha-${{ needs.resolve.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.resolve.outputs.sha }}
          cache-from: |
            type=gha,scope=test-${{ matrix.name }}
            type=gha,scope=selfhost-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=test-${{ matrix.name }}
          build-args: |
            VERSION=${{ inputs.version || needs.resolve.outputs.sha }}
            COMMIT=${{ needs.resolve.outputs.sha }}
            NEXT_PUBLIC_APP_VERSION=${{ inputs.version || 'dev' }}
            DATE=${{ steps.date.outputs.value }}
